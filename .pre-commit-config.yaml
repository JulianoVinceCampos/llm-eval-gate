# Local gate. Everything here also runs in CI; this copy exists to fail in seconds
# instead of in minutes, not to replace the pipeline.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # First in the file because it guards the one mistake that cannot be undone: a leak in
  # a public history. Zero dependencies, so it runs on a clean checkout.
  - repo: local
    hooks:
      - id: sanitize
        name: sanitize (no corporate context)
        entry: python3 tools/sanitize_scan.py
        language: system
        pass_filenames: false
        always_run: true
      - id: typography
        name: typography (no em or en dashes)
        entry: python3 tools/check_typography.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # The default types plus `eval:`, the type for new evidence (a recording or an
        # accepted reference). It is not a code change, so release-please leaves it out
        # of the changelog on purpose.
        args: [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test, eval]
