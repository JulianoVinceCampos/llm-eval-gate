name: codeql

on:
  workflow_call:

# Ceiling, not default: must cover what the job requests.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Python for the package, JavaScript for the dashboard, Actions for the pipeline
        # itself: a workflow is code that runs with a token.
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
        # Without continue-on-error, so an analysis that breaks turns the job red. Findings
        # do not: analyze uploads them and succeeds. What blocks a pull request on a finding
        # is the code scanning rule of the branch ruleset (docs/operacao.md), which is where
        # that policy belongs.
