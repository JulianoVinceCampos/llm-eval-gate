# The published calibration table is recomputed from its committed spec and must come
# out byte for byte the same. A change to the statistics that forgets to re-run the
# calibration fails here, so the README can never quote numbers the code no longer makes.
name: calibration

on:
  pull_request:
    paths:
      - "src/llm_eval_gate/stats.py"
      - "src/llm_eval_gate/gate.py"
      - "src/llm_eval_gate/calibration.py"
      - "src/llm_eval_gate/rng.py"
      - "evals/calibration.json"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Recompute the committed calibration
        run: llm-eval-gate calibrate --check
