name: sonar

on:
  workflow_call:
    secrets:
      # A reusable workflow must DECLARE every secret it accepts; passing an undeclared
      # one is a load error (startup_failure), not a run error. `required: false` because
      # the repo may not have SONAR_TOKEN yet, and then the job skips instead of failing.
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A fork PR has no access to the token. Skipping is correct; failing would teach
    # contributors that red is normal.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs history for blame and new-code detection.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Coverage report for Sonar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest --cov --cov-report=xml

      - name: Check whether SONAR_TOKEN exists
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN not configured: skipping the scan instead of failing."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan and quality gate
        if: steps.token.outputs.present == 'true'
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
