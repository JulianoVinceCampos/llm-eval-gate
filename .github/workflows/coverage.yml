name: coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Tests with line and branch coverage
        run: python -m pytest --cov --cov-report=json:coverage.json --cov-report=term-missing
      - name: Ratchet
        # A fixed threshold rots: people learn to live just above it. The floor only
        # ever goes up, which makes coverage a one-way door.
        run: python3 tools/coverage_ratchet.py coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-json
          path: coverage.json
          retention-days: 7
