# OpenSSF Scorecard: an external, automated opinion on the maturity of this repo.
# Runs on a schedule rather than per PR because most of what it measures (branch
# protection, signed releases, dependency update policy) changes on repo settings.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches: [main]

# Read-only at the workflow level, writes only in the job. This is not just least
# privilege: with publish_results the Scorecard API rejects results produced by a workflow
# that holds write permissions at the workflow level, and only the job running the action
# may hold id-token: write. A job-level block replaces the workflow default for that job,
# so the analysis job below still gets exactly what it declares.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      # Scorecard reads workflow runs for the CI-Tests and Token-Permissions checks.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
