name: docker

# O Dockerfile é um artefato entregável: se nada o constrói, ele apodrece calado.
# Em todo PR a imagem é construída, sobe e precisa responder como o deploy responde.
# No push para main ela é publicada no GHCR com SBOM e atestação de proveniência, para
# quem quiser rodar o painel fora do Render. O Render constrói o mesmo Dockerfile, no mesmo
# commit, só depois que os checks passam (render.yaml); sem etapa de instalação e com a
# base pinada por digest, as duas imagens partem dos mesmos bytes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t llm-eval-gate:ci .

      - name: Boot and probe
        run: |
          docker run -d --name leg -p 8000:8000 llm-eval-gate:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs leg
          test "${ok:-0}" = "1"

      - name: The dashboard must be served, not just the API
        run: curl -fsS http://127.0.0.1:8000/ | grep -q "llm-eval-gate"

      - name: A private endpoint must refuse an anonymous caller
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/overview)
          test "$code" = "401"

      - name: The demo gate must accept the default credentials
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"user":"julianovincedecampos","password":"llm-eval-gate"}' \
            http://127.0.0.1:8000/api/login)
          test "$code" = "200"

      - name: The container runs as a non-root user
        run: test "$(docker exec leg id -u)" != "0"

      - name: Stop
        if: always()
        run: docker rm -f leg || true

  publish:
    # Only main publishes. A pull request from a fork must never be able to push an image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        # A registry reference must be lowercase, and the owner of this repository is not:
        # `ghcr.io/${{ github.repository }}` would fail at push time.
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
