sonar.projectKey=JulianoVinceCampos_llm-eval-gate
sonar.organization=julianovincecampos
sonar.projectName=llm-eval-gate

sonar.sources=src,tools
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml

# A cobertura medida é a do pacote distribuído (src/llm_eval_gate), a mesma que o ratchet
# defende. tools/ são scripts de CI com teste próprio em tests/test_tools.py, fora do pacote;
# o dashboard JS não tem suíte de navegador e é verificado pelos testes de webapp e pela
# sonda do container. Contar os dois como "0% coberto" diria algo falso sobre o pacote.
sonar.coverage.exclusions=tools/**,src/llm_eval_gate/web/**

# O léxico e as famílias do gerador são dado escrito em Python, não lógica: frases em duas
# línguas com a mesma estrutura, que o detector de duplicação leria como cópia.
sonar.cpd.exclusions=src/llm_eval_gate/datasets/lexicon.py,src/llm_eval_gate/datasets/families.py

# Código novo é medido contra a main. O repositório nasce sem dívida, então o quality gate
# vale para o código novo e para o total.
sonar.newCode.referenceBranch=main

# Sem isto o passo de scan fica verde antes de o Sonar terminar, e o "gate" é decorativo.
sonar.qualitygate.wait=true
