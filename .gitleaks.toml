title = "llm-eval-gate"

[extend]
useDefault = true

[allowlist]
description = """
Placeholders documentados, usados nos testes e no corpus sintético. Cada valor aqui foi
escolhido justamente por nunca poder ser real: faixas de documentação da RFC 5737 e
identificadores só de zeros.
"""
regexes = [
  '''000000000000''',
  '''i-0EXAMPLE''',
  '''(?:192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}''',
]
paths = [
  # O scanner e as regras do Semgrep contêm os padrões por definição. Mesma lista de
  # SELF_EXEMPT em tools/sanitize_scan.py; os testes montam as fixtures em tempo de execução
  # e não precisam de isenção.
  '''tools/sanitize_scan\.py''',
  '''\.semgrep/.*''',
  '''\.gitleaks\.toml''',
]
